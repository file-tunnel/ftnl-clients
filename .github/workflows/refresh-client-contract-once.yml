name: refresh-client-contract-once

on:
  push:
    branches: ["feat/use-lib-core-validation-v1-20260903"]
    paths: [".github/workflows/refresh-client-contract-once.yml"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check jsonschema==4.25.1 tomlkit==0.13.3
      - name: Regenerate canonical client contract evidence
        run: python scripts/harden_client_contract.py --root . --schema clients/client-api.schema.json --write
      - name: Commit generated evidence without force-pushing
        run: |
          git diff --check
          if git diff --quiet; then
            echo "Contract evidence already current"
            exit 0
          fi
          git config user.name "zed-pkg automation"
          git config user.email "zed-pkg-automation@users.noreply.github.com"
          git add .zpkg.toml clients
          git commit -m "fix(contract): refresh canonical client evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
