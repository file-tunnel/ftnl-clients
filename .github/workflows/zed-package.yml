name: zed package interoperability

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - name: Check out certified Zed CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: 5d1d13119be5784f545a7d812cdfaae3ca120693
          path: zed-cli
          persist-credentials: false

      - name: Check out matching Zed interfaces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-interfaces
          ref: 92f046e393e7b421e9eea1afcc6c028ff8eb5859
          path: zed-interfaces
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Configure isolated output
        run: echo "ZED_PACK_OUT=$RUNNER_TEMP/zed-pack" >> "$GITHUB_ENV"

      - name: Validate package metadata
        working-directory: source
        run: nix develop --command python3 scripts/validate-zed-package.py --manifest-only

      - name: Validate JSON-Schema client contract before packaging
        working-directory: source
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.25.1
          python scripts/verify_client_contract.py

      - name: Pack every Zed target
        working-directory: source
        run: |
          nix develop --command cargo run --quiet --locked \
            --manifest-path ../zed-cli/Cargo.toml --bin zed -- \
            pack --out "$ZED_PACK_OUT"

      - name: Verify repository and isolated language artifacts
        working-directory: source
        run: nix develop --command python3 scripts/validate-zed-package.py --artifacts "$ZED_PACK_OUT"

      - name: Exercise publish planning without uploading
        working-directory: source
        run: |
          nix develop --command cargo run --quiet --locked \
            --manifest-path ../zed-cli/Cargo.toml --bin zed -- \
            publish --dry-run --skip-vcs-checks
