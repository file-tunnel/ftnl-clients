name: Formal boundary properties

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-boundaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-pairing-uri:
    name: Randomized pairing-fragment properties
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - working-directory: clients/rust
        run: nix develop ../.. --command cargo test --locked pairing_secret
