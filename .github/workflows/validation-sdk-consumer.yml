name: validation-sdk-consumer

on:
  pull_request:
    paths: ["validation-consumer/**", "scripts/check-validation-imports.py", ".github/workflows/validation-sdk-consumer.yml"]
  push:
    branches: [main]
    paths: ["validation-consumer/**", "scripts/check-validation-imports.py", ".github/workflows/validation-sdk-consumer.yml"]

permissions:
  contents: read

jobs:
  public-validation-consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: file-tunnel/ftnl-lib-core
          ref: e9fe4359c18d77b661384783bb5c979151cb5c33
          path: .deps/lib-core
      - run: python3 scripts/check-validation-imports.py
      - run: npm install --prefix .deps/lib-core/validation/typescript
      - run: npm run build --prefix .deps/lib-core/validation/typescript
      - run: npm install --prefix validation-consumer/typescript
      - run: npm run build --prefix validation-consumer/typescript
      - run: npm test --prefix validation-consumer/typescript
      - run: cargo test --manifest-path validation-consumer/rust/Cargo.toml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.x"
          cache: false
      - run: go test -mod=mod ./...
        working-directory: validation-consumer/golang
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "28.0"
          gleam-version: "1.14.0"
      - run: gleam test --target erlang
        working-directory: validation-consumer/gleam
      - run: gleam check --target javascript
        working-directory: validation-consumer/gleam
