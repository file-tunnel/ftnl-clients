name: mobile-clients

on:
  pull_request:
    paths:
      - ".github/workflows/mobile-clients.yml"
      - "clients/java/**"
      - "clients/swift/**"
      - "clients/dart/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/mobile-clients.yml"
      - "clients/java/**"
      - "clients/swift/**"
      - "clients/dart/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-clients-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java / Android-compatible JVM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert immutable job source HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile and run the Java transfer contract
        run: clients/java/test.sh

  swift:
    name: Swift Package
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert immutable job source HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Report the hosted Swift toolchain
        run: swift --version
      - name: Build and run the Swift transfer contract
        run: swift test --package-path clients/swift

  flutter-dart:
    name: Flutter / Dart package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert immutable job source HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true
      - name: Analyze and run the Flutter/Dart transfer contract
        working-directory: clients/dart
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test
