name: client-matrix

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python scripts/validate_client_matrix.py
      - name: Validate every SDK against the JSON-Schema API contract
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.25.1
          python scripts/verify_client_contract.py

  portable-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.22.x"
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
      - run: go test ./...
        working-directory: clients/go
      - run: ruby -c lib/ftnl_client.rb
        working-directory: clients/ruby
      - run: php -l src/Client.php
        working-directory: clients/php
