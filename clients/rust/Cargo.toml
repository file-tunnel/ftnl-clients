[package]
name = "ftnl-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust client for secure cross-device File Tunnels"
repository = "https://github.com/file-tunnel/ftnl-clients"

[dependencies]
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
