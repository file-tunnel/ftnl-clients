[package]
org = "file-tunnel"
name = "ftnl-clients"
version = "0.1.0"
description = "Official polyglot clients for secure cross-device File Tunnels"
license = "MIT"
keywords = ["clients", "sdk", "polyglot", "uploads", "file-tunnel"]

[package.repository]
vcs = "git"
url = "https://github.com/file-tunnel/ftnl-clients"

[install]
dir = ".vendor/.zed"

[dependencies]
"file-tunnel/ftnl-interfaces" = "^0.1.0"

[workspace]
members = ["clients/*"]

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".vendor/.zed/**", "**/target/**", "**/node_modules/**", "**/.dart_tool/**", "**/.gradle/**", "**/build/**"]

[targets.repository]
dir = "."

[targets.nodejs]
dir = "clients/typescript"
adapter = "node"

[targets.python]
dir = "clients/python"
adapter = "none"

[targets.golang]
dir = "clients/go"
adapter = "none"

[targets.rust]
dir = "clients/rust"
adapter = "none"

[targets.dart]
dir = "clients/dart"
adapter = "none"

[targets.gleam]
dir = "clients/gleam"
adapter = "none"

[targets.erlang]
dir = "clients/erlang"
adapter = "none"

[targets.elixir]
dir = "clients/elixir"
adapter = "none"

[targets.java]
dir = "clients/java"
adapter = "java"

[targets.kotlin]
dir = "clients/kotlin"
adapter = "java"

[targets.ruby]
dir = "clients/ruby"
adapter = "none"

[targets.php]
dir = "clients/php"
adapter = "none"

[targets.swift]
dir = "clients/swift"
adapter = "none"
