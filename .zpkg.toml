[package]
org = "file-tunnel"
name = "ftnl-clients"
version = "0.1.0"
description = "Official polyglot clients for secure cross-device File Tunnels"
license = "MIT"
keywords = ["clients", "sdk", "polyglot", "uploads", "file-tunnel"]

[package.repository]
vcs = "git"
url = "https://github.com/file-tunnel/ftnl-clients"

[install]
dir = ".vendor/.zed"

[dependencies]
"file-tunnel/ftnl-interfaces" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [
  ".env",
  ".env.*",
  ".direnv/**",
  ".zed/**",
  ".zed-pack/**",
  ".vendor/.zed/**",
  ".cache/**",
  "tmp/**",
  "**/*.log",
  ".DS_Store",
]

# Publish one complete source snapshot plus independently consumable packages.
[targets.repository]
dir = "."
name = "ftnl-clients-repository"

[targets.nodejs]
dir = "clients/typescript"
name = "ftnl-clients-nodejs"
adapter = "node"

[targets.rust]
dir = "clients/rust"
adapter = "rust"

[targets.dart]
dir = "clients/dart"
adapter = "dart"

[targets.gleam]
dir = "clients/gleam"

[targets.gleamlang]
dir = "clients/gleamlang"
adapter = "none"

[targets.erlang]
dir = "clients/erlang"
adapter = "none"

[targets.elixir]
dir = "clients/elixir"
adapter = "none"

[targets.java]
dir = "clients/java"
adapter = "java"

[targets.golang]
dir = "clients/golang"
adapter = "go"

[targets.python3]
dir = "clients/python3"
adapter = "none"

[targets.ruby]
dir = "clients/ruby"
adapter = "none"

[targets.php]
dir = "clients/php"
adapter = "none"

[targets.typescript-nodejs]
dir = "clients/typescript/nodejs"
adapter = "node"

[targets.typescript-deno]
dir = "clients/typescript/deno"
adapter = "none"

[targets.typescript-bun]
dir = "clients/typescript/bun"
adapter = "node"

[targets.typescript-edge]
dir = "clients/typescript/edge"
adapter = "none"
